<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />  
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <header>
        
            <nav>
                 <img src="./img/logo_elLluvioso.png" alt="Logo del Hotel el Lluviso">

                <ul>
                    <li> <a href="./index.html">Inicio</a> </li>
                    <li> <a href="./login.html">Login</a> </li>

                </ul>
            </nav>
        
    </header>

    <main class="container ">

        <h1 class="mt-2 text-center">Login</h1><br>
        <form action="../controllers/login.php" method="post" class="mx-auto p-3">
            <input type="hidden" name="action" value="animar">

            <div class="mb-3">
                <label for="username" class="form-label">Username:</label>
                <input type="text" class="form-control" id="username" name="user" required placeholder="Enter your username">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" class="form-control" id="password" name="clave" required placeholder="Enter your password">
            </div>

            <div class="mb-3">
                <label for="rol" class="form-label">Rol:</label>

                <select class="form-select" name="rol" id="rol"  required>

                    <option value="administrador">Administrador</option>
                    <option value="operario">Operario</option>
                    <option value="cliente">Cliente</option>

                </select>
                
            </div>

            <div class="d-grid col-7 mx-auto mb-3">
                <input type="submit" value="Login" class="btn btn-primary">
            </div>

        </form>

    </main>
    
</body>

</html>
